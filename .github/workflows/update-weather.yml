name: Update Aviation Weather

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      - name: Get latest aviation weather
        run: |
          python scripts/update_weather.py


      - name: Save weather data
        run: |

          git config user.name "Hovey Weather Bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add data/weather.json

          if git diff --cached --quiet
          then
            echo "No changes"
          else
            git commit -m "Update aviation weather"
            git push
          fi