name: Update Aviation Weather

on:
  workflow_dispatch:

  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests


      - name: Test Aviation Weather API
        run: |
          python - <<'PY'
          import requests

          url = (
              "https://aviationweather.gov/"
              "api/data/metar"
          )

          params = {
              "ids": "KNDZ,KPNS,KMOB,KHSA,KTLH,KDHN",
              "format": "json"
          }

          response = requests.get(
              url,
              params=params,
              headers={
                  "User-Agent":
                  "HoveysFlightDesk/1.0"
              },
              timeout=30
          )

          print("STATUS:", response.status_code)
          print("URL:", response.url)
          print(response.text[:2000])

          response.raise_for_status()
          PY


      - name: Update weather JSON
        run: |
          python scripts/update_weather.py


      - name: Show generated weather
        run: |
          echo "Generated weather.json:"
          cat data/weather.json


      - name: Commit weather update
        run: |
          git config user.name "Hovey Weather Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/weather.json

          if git diff --cached --quiet
          then
            echo "No weather changes to commit."
          else
            git commit -m "Update aviation weather"
            git push
          fi